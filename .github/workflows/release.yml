name: "Release"

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and tags
        id: check
        run: |
          VERSION=$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)
          TAG_NAME="v$VERSION"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: building $TAG_NAME."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists. Skipping release build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG_NAME does not exist. Building release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.check-version.outputs.tag_name }}
    steps:
      - name: Create the release, or clear the assets of an existing one
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while read -r asset; do gh release delete-asset "$TAG" "$asset" -R "$GITHUB_REPOSITORY" -y; done
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Music Transpose $TAG" \
              --notes "Download the installer for your system from the assets below."
          fi

  publish-tauri:
    needs: [check-version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: macOS (Apple Silicon)
            os: macos-latest
          - name: macOS (Intel)
            os: macos-15-intel
          - name: Windows
            os: windows-latest
    name: "Build ${{ matrix.name }}"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend sidecar
        run: |
          python -m pip install -e "apps/backend[dev]"
          python apps/backend/scripts/build_sidecar.py

      # Tauri downloads its packaging tools from github.com while bundling, and
      # those downloads fail with transient 504s. A retry only repeats the bundling.
      - name: Build installers
        working-directory: apps/desktop
        run: |
          for attempt in 1 2 3 4; do
            if pnpm tauri build --verbose; then exit 0; fi
            echo "Build attempt $attempt failed."
            sleep 30
          done
          exit 1

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag_name }}
        run: |
          mkdir staging
          find apps/desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' \) |
            while read -r file; do
              name=$(basename "$file")
              cp "$file" "staging/${name// /.}"
            done
          ls -l staging
          gh release upload "$TAG" staging/* -R "$GITHUB_REPOSITORY" --clobber
